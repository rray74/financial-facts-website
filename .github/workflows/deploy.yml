# Deploys the site to Hostinger every time you push to `main`
# (e.g. Commit and Sync/Push in VS Code's Source Control panel).
#
# How it works: GitHub connects to the Hostinger server over SSH and runs
# `git pull` in the app folder, then applies any new database migrations.
# Nothing is copied or deleted on the server except files tracked in Git,
# so server-only files (config/database.local.php, the admin .htaccess and
# .htpasswd) are never touched.
#
# One-time setup: see README → "Deploying to Hostinger" →
# "Automatic deploys from VS Code". It needs these repository secrets:
#   HOSTINGER_HOST      SSH host from hPanel → Advanced → SSH Access
#   HOSTINGER_PORT      SSH port from the same page
#   HOSTINGER_USER      SSH username from the same page
#   HOSTINGER_SSH_KEY   private key whose public half is added in hPanel
#   HOSTINGER_APP_PATH  full path to the app folder, e.g.
#                       /home/u123456789/domains/yourdomain.com/app

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  # Adds a "Run workflow" button on GitHub's Actions tab, to redeploy
  # without pushing anything new.
  workflow_dispatch:

# Never run two deploys at once. A newer push waits for the current one.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code on Hostinger and run migrations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            # Stop at the first failure, so a broken step shows as a
            # failed deploy (red cross on GitHub) instead of passing quietly.
            set -e

            cd "${{ secrets.HOSTINGER_APP_PATH }}"

            # --ff-only refuses to merge, so if files on the server were
            # ever edited by hand the deploy stops instead of mixing them in.
            git pull --ff-only origin main

            # Applies only migrations that haven't run yet. On a normal
            # deploy this prints "Nothing to migrate".
            php scripts/migrate.php

            echo "Deployed commit $(git rev-parse --short HEAD)"
